<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management System (Firebase Cloud)</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --input-bg: #1f2937;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-cyan: #38bdf8;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-red: #f87171;
            --row-hover: #1e293b;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-sub: #475569;
            --input-bg: #f1f5f9;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-cyan: #0284c7;
            --accent-green: #059669;
            --accent-yellow: #d97706;
            --accent-red: #dc2626;
            --row-hover: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            font-size: 14px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .profile-container {
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .profile-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 6px 12px rgba(56, 189, 248, 0.4);
            background: linear-gradient(135deg, #e0f2fe, #38bdf8);
            padding: 4px;
            animation: fly3d 3s ease-in-out infinite alternate;
        }

        @keyframes fly3d {
            0% {
                transform: translateY(0px) rotateY(0deg) rotateZ(0deg) scale(1);
                box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
            }
            50% {
                transform: translateY(-6px) rotateY(15deg) rotateZ(-3deg) scale(1.05);
                box-shadow: 0 12px 20px rgba(56, 189, 248, 0.5);
            }
            100% {
                transform: translateY(3px) rotateY(-15deg) rotateZ(3deg) scale(0.98);
                box-shadow: 0 6px 10px rgba(56, 189, 248, 0.2);
            }
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .clock-badge {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .theme-btn, .lang-select {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            outline: none;
            font-weight: 600;
        }

        .menu-toggle-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .menu-toggle-btn:hover { border-color: var(--primary); }

        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
        }

        .sidebar-overlay.active { display: block; }

        .settings-sidebar {
            position: fixed;
            top: 0; right: -360px;
            width: 320px; height: 100%;
            background-color: var(--card-bg);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            padding: 20px;
            box-shadow: -4px 0 20px rgba(0,0,0,0.3);
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .settings-sidebar.active { right: 0; }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            font-weight: 800;
            font-size: 15px;
        }

        .close-sidebar-btn {
            background: none; border: none;
            color: var(--text-sub);
            font-size: 22px; cursor: pointer;
        }

        .sidebar-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-group label {
            font-size: 12px; font-weight: 700;
            color: var(--text-sub);
        }

        .sidebar-select {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px; border-radius: 8px;
            outline: none; font-size: 13px; width: 100%;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px; margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 16px; border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .stat-title {
            font-size: 11px; color: var(--text-sub);
            font-weight: 700; margin-bottom: 6px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 22px; font-weight: 800;
            color: var(--accent-cyan);
        }

        .section-header {
            font-size: 16px; font-weight: 800;
            margin-bottom: 12px; display: flex;
            align-items: center; justify-content: space-between; gap: 8px;
        }

        .form-container {
            background-color: var(--card-bg);
            padding: 18px; border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px; margin-bottom: 16px;
        }

        .form-group { 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            position: relative;
        }

        .form-group label {
            font-size: 12px; color: var(--text-sub);
            margin-bottom: 4px; font-weight: 700;
        }

        .form-group input, .form-group select {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px; border-radius: 6px;
            outline: none; font-size: 13px; font-weight: 600;
            height: 40px;
        }

        .age-label-text {
            color: var(--accent-cyan); 
            font-size: 11px; 
            font-weight: 700;
            position: absolute;
            right: 10px;
            top: 2px;
        }

        .btn-save {
            width: 100%; background-color: var(--primary);
            color: white; border: none; padding: 12px;
            border-radius: 6px; font-weight: 800;
            font-size: 14px; cursor: pointer;
        }

        .btn-save:hover { background-color: var(--primary-hover); }

        .top-search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            width: 100%;
        }

        .top-search-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
            font-weight: 600;
        }

        .top-search-input:focus {
            border-color: var(--accent-cyan);
        }

        .controls-row {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 16px;
            gap: 12px; flex-wrap: wrap;
        }

        .filter-buttons {
            display: flex; gap: 6px;
            background-color: var(--card-bg);
            padding: 3px; border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .filter-btn {
            background: none; border: none;
            color: var(--text-sub); padding: 6px 12px;
            border-radius: 4px; cursor: pointer;
            font-size: 12px; font-weight: 700;
        }

        .filter-btn.active {
            background-color: var(--primary); color: white;
        }

        .action-btns-group {
            display: flex;
            gap: 8px;
        }

        .btn-delete-selected {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 8px 14px; border-radius: 6px;
            cursor: pointer; font-size: 12px; font-weight: 800;
            display: none;
        }

        .btn-delete-selected:hover {
            background-color: rgba(239, 68, 68, 0.35);
        }

        .btn-clear-all {
            background-color: rgba(248, 113, 113, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(248, 113, 113, 0.3);
            padding: 8px 14px; border-radius: 6px;
            cursor: pointer; font-size: 12px; font-weight: 800;
        }

        .table-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px; overflow: hidden;
        }

        .table-responsive { width: 100%; overflow-x: auto; }

        table {
            width: 100%; border-collapse: collapse;
            text-align: left; font-size: 13px;
        }

        thead {
            background-color: var(--input-bg);
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-sub); padding: 10px 12px;
            font-weight: 700; font-size: 11px;
            text-transform: uppercase; letter-spacing: 0.5px;
            white-space: nowrap;
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap; vertical-align: middle;
            color: var(--text-main); font-size: 13px;
        }

        tbody tr:hover { background-color: var(--row-hover); }

        /* Custom Checkbox Styling */
        .custom-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
            vertical-align: middle;
        }

        .row-select-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .name-text { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .date-badge { font-size: 12px; color: var(--accent-cyan); font-weight: 600; font-family: monospace; }
        .id-badge {
            font-family: monospace; background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-cyan); padding: 3px 6px; border-radius: 4px;
            font-weight: 700; font-size: 12px;
        }
        .phone-badge {
            font-family: monospace; background-color: rgba(251, 191, 36, 0.15);
            color: var(--accent-yellow); padding: 3px 6px; border-radius: 4px;
            font-weight: 700; font-size: 12px;
        }
        .pass-badge {
            font-family: monospace; background-color: rgba(52, 211, 153, 0.15);
            color: var(--accent-green); padding: 3px 6px; border-radius: 4px;
            font-weight: 700; font-size: 12px;
        }

        .status-pill {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 12px;
            font-size: 11px; font-weight: 700; cursor: pointer;
        }

        .status-pill.working {
            background-color: rgba(56, 189, 248, 0.15); color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .status-pill.finished {
            background-color: rgba(52, 211, 153, 0.15); color: var(--accent-green);
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        /* Modernized Vector Icon Buttons */
        .action-group { display: flex; align-items: center; gap: 6px; }

        .btn-icon-only {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-icon-only:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        .btn-icon-status-ok { background-color: rgba(244, 63, 94, 0.18); color: #f43f5e; }
        .btn-icon-status-issue { background-color: rgba(239, 68, 68, 0.25); color: #ef4444; }
        .btn-icon-edit { background-color: rgba(251, 191, 36, 0.18); color: #fbbf24; }
        .btn-icon-share { background-color: rgba(52, 211, 153, 0.18); color: #34d399; }

        .no-data {
            text-align: center; color: var(--text-sub);
            padding: 30px 15px; font-weight: 700; font-size: 13px;
        }

        @media (max-width: 900px) {
            .stats-grid, .form-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 500px) {
            .stats-grid, .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-nav">
        <div class="profile-container">
            <img class="profile-img" id="userProfileImg" src="https://api.iconify.design/fluent-emoji-flat:dove.svg" alt="3D Flying Bird">
        </div>

        <div class="nav-controls">
            <span class="clock-badge" id="currentTime">🕒 00:00:00 PM</span>
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Night Mode</button>
            <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="MM">MM မြန်မာ</option>
                <option value="EN">EN English</option>
                <option value="TH">TH ไทย</option>
            </select>
            <button class="menu-toggle-btn" onclick="toggleSidebar()" title="Settings">☰</button>
        </div>
    </div>

    <!-- Sidebar Menu Settings -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="settings-sidebar" id="settingsSidebar">
        <div class="sidebar-header">
            <span>⚙️ SETTINGS</span>
            <button class="close-sidebar-btn" onclick="toggleSidebar()">&times;</button>
        </div>

        <div class="sidebar-group">
            <label>📅 လချုပ်စာရင်း စစ်ဆေးရန် (၁၂ လ)</label>
            <select class="sidebar-select" id="monthFilter" onchange="applyFilters()">
                <option value="ALL">📅 လချုပ်စာရင်း (အားလုံး)</option>
            </select>
        </div>

        <div class="sidebar-group">
            <label>⚠️ စာရင်း အခြေအနေ စစ်ဆေးရန်</label>
            <select class="sidebar-select" id="bannedFilter" onchange="applyFilters()">
                <option value="ALL">စာရင်း အားလုံးပြပါ</option>
                <option value="OK">❤️ အဆင်ပြေသော စာရင်းများသာပြပါ</option>
                <option value="ISSUE">❌ အဆင်မပြေသော စာရင်းများသာပြပါ</option>
            </select>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title" id="lbl_total_clients">TOTAL CLIENTS</div>
            <div class="stat-value" id="totalClients">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title" id="lbl_working">WORKING</div>
            <div class="stat-value" id="totalWorking">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title" id="lbl_finished">FINISHED</div>
            <div class="stat-value" id="totalFinished" style="color: var(--accent-green);">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title" id="lbl_revenue">TOTAL REVENUE (THB)</div>
            <div class="stat-value" id="totalRevenue" style="color: var(--accent-yellow);">0</div>
        </div>
    </div>

    <div class="section-header">
        <span id="lbl_form_title">👤 စာရင်းသစ်ထည့်သွင်းရန်</span>
    </div>

    <div class="form-container">
        <form id="clientForm">
            <input type="hidden" id="editId" value="">
            <div class="form-grid">
                <div class="form-group">
                    <label id="lbl_doc_id">💳 Pass/Work နံပါတ် *</label>
                    <input type="text" id="docId" placeholder="CC8142321" required oninput="checkDocIdAutoFill(this.value)">
                </div>
                <div class="form-group">
                    <label id="lbl_name">👤 နာမည် (English စာလုံးကြီး) *</label>
                    <input type="text" id="name" placeholder="NAME" required oninput="this.value = this.value.toUpperCase()">
                </div>
                <div class="form-group">
                    <label id="lbl_dob">🎂 မွေးနေ့ *</label>
                    <span class="age-label-text" id="ageLabel"></span>
                    <input type="date" id="dob" required onchange="calcAge()">
                </div>
                <div class="form-group">
                    <label id="lbl_email">✉ Gmail</label>
                    <input type="email" id="email" placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label id="lbl_pass">🔑 Password</label>
                    <input type="text" id="password" placeholder="112025">
                </div>
                <div class="form-group">
                    <label id="lbl_phone">📞 ဖုန်းနံပါတ်</label>
                    <input type="tel" id="phone" placeholder="0812345678">
                </div>
                <div class="form-group">
                    <label id="lbl_status">⚙ လုပ်ငန်းအခြေအနေ</label>
                    <select id="status">
                        <option value="WORKING">WORKING</option>
                        <option value="FINISHED">FINISHED</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="lbl_fee">💰 ဝန်ဆောင်ခ / ကျသင့်ငွေ (THB)</label>
                    <input type="number" id="revenue" placeholder="1000" value="0">
                </div>
            </div>
            <button type="submit" class="btn-save" id="btn_save">💾 စာရင်းသိမ်းဆည်းမည်</button>
        </form>
    </div>

    <div class="controls-row">
        <div class="filter-buttons">
            <button class="filter-btn active" id="btn_f_all" onclick="setFilter('ALL', this)">အားလုံး</button>
            <button class="filter-btn" id="btn_f_work" onclick="setFilter('WORKING', this)">Working</button>
            <button class="filter-btn" id="btn_f_done" onclick="setFilter('FINISHED', this)">Completed</button>
        </div>
        <div class="action-btns-group">
            <button class="btn-delete-selected" id="btn_delete_selected" onclick="deleteSelectedData()">🗑 အမှန်ခြစ်ထားသည်များဖျက်မည်</button>
            <button class="btn-clear-all" id="btn_clear_all" onclick="clearAllData()">🗑 အားလုံးဖျက်မည်</button>
        </div>
    </div>

    <div class="top-search-box">
        <input type="text" class="top-search-input" id="searchInput" placeholder="🔍 Pass/Work နံပါတ် သို့မဟုတ် နာမည် သို့မဟုတ် ဖုန်းနံပါတ် ရိုက်ရှာပါ..." oninput="handleSearch(this.value)">
    </div>

    <div class="section-header" id="lbl_list_title">📁 သိမ်းဆည်းထားသော စာရင်းများ</div>
    <div class="table-card">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 45px;"><input type="checkbox" class="custom-checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)"></th>
                        <th id="th_saved_time">SAVED DATE</th>
                        <th id="th_name">အမည်</th>
                        <th id="th_doc_id">Pass/Work</th>
                        <th id="th_dob">မွေးနေ့ (အသက်)</th>
                        <th>Gmail</th>
                        <th id="th_pass">Password</th>
                        <th id="th_phone">ဖုန်းနံပါတ်</th>
                        <th id="th_status">အခြေအနေ</th>
                        <th id="th_fee">ကျသင့်ငွေ</th>
                        <th id="th_action">လုပ်ဆောင်ချက်</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Firebase SDK Modern Imports -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configurations
    const firebaseConfig = {

      authDomain: "doeservice-f5991.firebaseapp.com",
      projectId: "doeservice-f5991",
      storageBucket: "doeservice-f5991.firebasestorage.app",
      messagingSenderId: "966320006999",
      appId: "1:966320006999:web:b8050e2c17f15d5de84012",
      measurementId: "G-L72FYQ1YGH"
    };

    // Firebase Initialize
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const clientsCollection = collection(db, "clients");

    let clients = [];
    let currentFilter = 'ALL';
    let currentLang = 'MM';

    const i18n = {
        MM: {
            total_clients: "TOTAL CLIENTS", working: "WORKING", finished: "FINISHED", revenue: "TOTAL REVENUE (THB)",
            form_title: "👤 စာရင်းသစ်ထည့်သွင်းရန်", form_title_edit: "✏️ စာရင်း ပြန်လည်ပြင်ဆင်ရန်", doc_id: "💳 Pass/Work နံပါတ် *", name: "👤 နာမည် (English စာလုံးကြီး) *",
            dob: "🎂 မွေးနေ့ *", email: "✉ Gmail", pass: "🔑 Password", phone: "📞 ဖုန်းနံပါတ်", status: "⚙ လုပ်ငန်းအခြေအနေ",
            fee: "💰 ဝန်ဆောင်ခ / ကျသင့်ငွေ (THB)", save: "💾 စာရင်းသိမ်းဆည်းမည်", update: "🔄 ပြင်ဆင်ချက် သိမ်းမည်", search: "🔍 Pass/Work နံပါတ် သို့မဟုတ် နာမည် သို့မဟုတ် ဖုန်းနံပါတ် ရိုက်ရှာပါ...",
            f_all: "အားလုံး", f_work: "Working", f_done: "Completed", clear_all: "🗑 အားလုံးဖျက်မည်",
            list_title: "📁 သိမ်းဆည်းထားသော စာရင်းများ", age_suffix: " နှစ်", no_data: "သိမ်းဆည်းထားသော စာရင်း မရှိသေးပါ။",

        },
        EN: {
            total_clients: "TOTAL CLIENTS", working: "WORKING", finished: "FINISHED", revenue: "TOTAL REVENUE (THB)",
            form_title: "👤 Add New Client", form_title_edit: "✏️ Edit Client Record", doc_id: "💳 Pass/Work No. *", name: "👤 Full Name (UPPERCASE) *",
            dob: "🎂 Date of Birth *", email: "✉ Gmail", pass: "🔑 Password", phone: "📞 Phone Number", status: "⚙ Work Status",
            fee: "💰 Revenue / Fee (THB)", save: "💾 Save Record", update: "🔄 Update Record", search: "🔍 Search Pass/Work, Name or Phone...",
            f_all: "All", f_work: "Working", f_done: "Completed", clear_all: "🗑 Delete All",
            list_title: "📁 Saved Records", age_suffix: " yrs", no_data: "No records found.",
            th_saved_time: "SAVED DATE", th_name: "Name", th_doc_id: "Pass/Work", th_dob: "DOB (Age)", th_pass: "Password", th_phone: "Phone", th_status: "Status", th_fee: "Fee (THB)", th_action: "Actions"
        },
        TH: {
            total_clients: "ลูกค้าทั้งหมด", working: "กำลังดำเนินการ", finished: "เสร็จสิ้น", revenue: "รายได้ทั้งหมด (THB)",
            form_title: "👤 เพิ่มข้อมูลใหม่", form_title_edit: "✏️ แก้ไขข้อมูล", doc_id: "💳 Pass/Work *", name: "👤 ชื่อ-นามสกุล (ตัวพิมพ์ใหญ่) *",
            dob: "🎂 วันเกิด *", email: "✉ อีเมล", pass: "🔑 รหัสผ่าน", phone: "📞 เบอร์โทรศัพท์", status: "⚙ สถานะงาน",
            fee: "💰 ค่าบริการ (THB)", save: "💾 บันทึกข้อมูล", update: "🔄 อัปเดตข้อมูล", search: "🔍 ค้นหาด้วย Pass/Work, ชื่อ หรือเบอร์โทร...",
            f_all: "ทั้งหมด", f_work: "กำลังดำเนินการ", f_done: "เสร็จสิ้น", clear_all: "🗑 ลบทั้งหมด",
            list_title: "📁 บันทึกข้อมูลแล้ว", age_suffix: " ปี", no_data: "ไม่พบข้อมูล",
            th_saved_time: "วันที่บันทึก", th_name: "ชื่อ", th_doc_id: "Pass/Work", th_dob: "วันเกิด (อายุ)", th_pass: "รหัสผ่าน", th_phone: "เบอร์โทรศัพท์", th_status: "สถานะ", th_fee: "ค่าบริการ", th_action: "จัดการ"
        }
    };

    // Realtime Data Sync from Firebase Cloud
    onSnapshot(clientsCollection, (snapshot) => {
        clients = [];
        snapshot.forEach((doc) => {
            clients.push({ id: doc.id, ...doc.data() });
        });
        populateMonthFilter();
        applyFilters();
    });

    window.toggleSidebar = function() {
        document.getElementById('settingsSidebar').classList.toggle('active');
        document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('currentTime').textContent = '🕒 ' + now.toLocaleTimeString('en-US');
    }
    setInterval(updateClock, 1000);
    updateClock();

    window.toggleTheme = function() {
        const currentTheme = document.body.getAttribute('data-theme');
        const themeBtn = document.getElementById('themeBtn');
        if (currentTheme === 'light') {
            document.body.removeAttribute('data-theme');
            themeBtn.textContent = '🌙 Night Mode';
        } else {
            document.body.setAttribute('data-theme', 'light');
            themeBtn.textContent = '☀️ Day Mode';
        }
    }

    window.changeLanguage = function(lang) {
        currentLang = lang;
        const t = i18n[lang];

        document.getElementById('lbl_total_clients').textContent = t.total_clients;
        document.getElementById('lbl_working').textContent = t.working;
        document.getElementById('lbl_finished').textContent = t.finished;
        document.getElementById('lbl_revenue').textContent = t.revenue;
        
        const isEdit = document.getElementById('editId').value !== "";
        document.getElementById('lbl_form_title').textContent = isEdit ? t.form_title_edit : t.form_title;
        document.getElementById('btn_save').textContent = isEdit ? t.update : t.save;

        document.getElementById('lbl_doc_id').textContent = t.doc_id;
        document.getElementById('lbl_name').textContent = t.name;
        document.getElementById('lbl_dob').textContent = t.dob;
        document.getElementById('lbl_email').textContent = t.email;
        document.getElementById('lbl_pass').textContent = t.pass;
        document.getElementById('lbl_phone').textContent = t.phone;
        document.getElementById('lbl_status').textContent = t.status;
        document.getElementById('lbl_fee').textContent = t.fee;
        document.getElementById('searchInput').placeholder = t.search;
        document.getElementById('btn_f_all').textContent = t.f_all;
        document.getElementById('btn_f_work').textContent = t.f_work;
        document.getElementById('btn_f_done').textContent = t.f_done;
        document.getElementById('btn_clear_all').textContent = t.clear_all;
        document.getElementById('lbl_list_title').textContent = t.list_title;

        document.getElementById('th_saved_time').textContent = t.th_saved_time;
        document.getElementById('th_name').textContent = t.th_name;
        document.getElementById('th_doc_id').textContent = t.th_doc_id;
        document.getElementById('th_dob').textContent = t.th_dob;
        document.getElementById('th_pass').textContent = t.th_pass;
        document.getElementById('th_phone').textContent = t.th_phone;
        document.getElementById('th_status').textContent = t.th_status;
        document.getElementById('th_fee').textContent = t.th_fee;
        document.getElementById('th_action').textContent = t.th_action;

        calcAge();
        applyFilters();
    }

    window.calcAge = function() {
        const dobVal = document.getElementById('dob').value;
        if (dobVal) {
            const dob = new Date(dobVal);
            const today = new Date();
            let age = today.getFullYear() - dob.getFullYear();
            const m = today.getMonth() - dob.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
            document.getElementById('ageLabel').textContent = age + i18n[currentLang].age_suffix;
        } else {
            document.getElementById('ageLabel').textContent = '';
        }
    }

    window.checkDocIdAutoFill = function(val) {
        const cleanVal = val.trim().toUpperCase();
        if(!cleanVal) return;
        
        const match = clients.find(c => c.docId.toUpperCase() === cleanVal);
        if(match) {
            editItem(match.id);
        }
    }

    window.handleSearch = function(val) {
        applyFilters();
        const cleanVal = val.trim().toUpperCase();
        if(cleanVal) {
            const match = clients.find(c => c.docId.toUpperCase() === cleanVal);
            if(match) {
                editItem(match.id);
            }
        }
    }

    window.toggleIssueStatus = async function(id) {
        const client = clients.find(c => c.id === id);
        if (client) {
            const isIssue = !client.isIssue;
            await updateDoc(doc(db, "clients", id), { isIssue: isIssue });
        }
    }

    document.getElementById('clientForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const editId = document.getElementById('editId').value;
        const inputDocId = document.getElementById('docId').value.trim().toUpperCase();
        const inputName = document.getElementById('name').value.trim().toUpperCase();

        const now = new Date();
        const savedDateOnly = now.getFullYear() + '-' + 
            String(now.getMonth() + 1).padStart(2, '0') + '-' + 
            String(now.getDate()).padStart(2, '0');

        const monthKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');

        const dataObj = {
            createdAt: savedDateOnly,
            monthKey: monthKey,
            docId: inputDocId,
            name: inputName,
            dob: document.getElementById('dob').value,
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            status: document.getElementById('status').value,
            revenue: parseFloat(document.getElementById('revenue').value) || 0
        };

        if (editId) {
            await updateDoc(doc(db, "clients", editId), dataObj);
        } else {
            dataObj.isIssue = false;
            await addDoc(clientsCollection, dataObj);
        }

        this.reset();
        document.getElementById('editId').value = "";
        document.getElementById('ageLabel').textContent = '';
        changeLanguage(currentLang);
    });

    function populateMonthFilter() {
        const monthSelect = document.getElementById('monthFilter');
        const selectedVal = monthSelect.value;
        monthSelect.innerHTML = `<option value="ALL">📅 လချုပ်စာရင်း (အားလုံး)</option>`;

        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const currentYear = new Date().getFullYear();

        for (let i = 0; i < 12; i++) {
            const mNum = String(i + 1).padStart(2, '0');
            const mKey = `${currentYear}-${mNum}`;
            const option = document.createElement('option');
            option.value = mKey;
            option.textContent = `📅 ${monthNames[i]} ${currentYear} လချုပ်`;
            monthSelect.appendChild(option);
        }

        monthSelect.value = selectedVal;
    }

    window.toggleStatus = async function(id) {
        const client = clients.find(c => c.id === id);
        if (client) {
            const newStatus = (client.status === 'WORKING') ? 'FINISHED' : 'WORKING';
            await updateDoc(doc(db, "clients", id), { status: newStatus });
        }
    }

    window.editItem = function(id) {
        const client = clients.find(c => c.id === id);
        if (!client) return;

        document.getElementById('editId').value = client.id;
        document.getElementById('docId').value = client.docId;
        document.getElementById('name').value = client.name;
        document.getElementById('dob').value = client.dob;
        document.getElementById('email').value = client.email;
        document.getElementById('password').value = client.password;
        document.getElementById('phone').value = client.phone || client.pincode || '';
        document.getElementById('status').value = client.status;
        document.getElementById('revenue').value = client.revenue;

        calcAge();
        changeLanguage(currentLang);
    }

    window.shareItem = function(id) {
        const c = clients.find(item => item.id === id);
        if (!c) return;

        let age = '';
        if(c.dob) {
            const dob = new Date(c.dob);
            const today = new Date();
            age = today.getFullYear() - dob.getFullYear();
        }

        const issueStatusText = c.isIssue ? "❌ အဆင်မပြေပါ" : "❤️ အဆင်ပြေပါသည်";

        const text = `📋 *Client Data*\n\n` +
                     `📅 *Saved Date:* ${c.createdAt || '-'}\n` +
                     `👤 *Name:* ${c.name}\n` +
                     `💳 *Pass/Work:* ${c.docId}\n` +
                     `🎂 *DOB:* ${c.dob || '-'} (${age} yrs)\n` +
                     `✉ *Email:* ${c.email || '-'}\n` +
                     `🔑 *Password:* ${c.password || '-'}\n` +
                     `📞 *Phone:* ${c.phone || c.pincode || '-'}\n` +
                     `⚙ *Status:* ${c.status}\n` +
                     `⚠️ *အခြေအနေ:* ${issueStatusText}\n` +
                     `💰 *Fee:* ${c.revenue.toLocaleString()} THB`;

        if (navigator.share) {
            navigator.share({ title: 'Client Data', text: text }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            alert('အချက်အလက်များကို Copy ကူးပြီးပါပြီ!');
        }
    }

    function updateDashboard(currentDataList) {
        document.getElementById('totalClients').textContent = currentDataList.length;
        document.getElementById('totalWorking').textContent = currentDataList.filter(c => c.status === 'WORKING').length;
        document.getElementById('totalFinished').textContent = currentDataList.filter(c => c.status === 'FINISHED').length;
        const revSum = currentDataList.reduce((sum, c) => sum + (c.revenue || 0), 0);
        document.getElementById('totalRevenue').textContent = revSum.toLocaleString();
    }

    window.setFilter = function(status, btn) {
        currentFilter = status;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilters();
    }

    window.applyFilters = function() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const selectedMonth = document.getElementById('monthFilter').value;
        const bannedVal = document.getElementById('bannedFilter').value;

        const filtered = clients.filter(c => {
            const docMatch = c.docId ? c.docId.toLowerCase().includes(query) : false;
            const nameMatch = c.name ? c.name.toLowerCase().includes(query) : false;
            const phoneVal = c.phone || c.pincode || '';
            const phoneMatch = phoneVal ? phoneVal.toLowerCase().includes(query) : false;
            
            const matchesSearch = query === '' || docMatch || nameMatch || phoneMatch;
            const matchesFilter = (currentFilter === 'ALL') || (c.status === currentFilter);
            const cMonth = c.monthKey || c.createdAt?.substring(0, 7);
            const matchesMonth = (selectedMonth === 'ALL') || (cMonth === selectedMonth);
            
            let matchesBanned = true;
            if (bannedVal === 'OK') matchesBanned = !c.isIssue;
            if (bannedVal === 'ISSUE') matchesBanned = !!c.isIssue;

            return matchesSearch && matchesFilter && matchesMonth && matchesBanned;
        });

        updateDashboard(filtered);
        renderTable(filtered);
    }

    /* Checkbox & Delete Selected Functions */
    window.toggleSelectAll = function(isChecked) {
        const rowCheckboxes = document.querySelectorAll('.row-checkbox');
        rowCheckboxes.forEach(cb => cb.checked = isChecked);
        updateDeleteSelectedBtnState();
    }

    window.updateDeleteSelectedBtnState = function() {
        const checkedCount = document.querySelectorAll('.row-checkbox:checked').length;
        const btnDeleteSelected = document.getElementById('btn_delete_selected');
        
        if (checkedCount > 0) {
            btnDeleteSelected.style.display = 'inline-block';
            btnDeleteSelected.textContent = `🗑 အမှန်ခြစ်ထားသည် (${checkedCount}) ခုဖျက်မည်`;
        } else {
            btnDeleteSelected.style.display = 'none';
        }

        const totalRowCheckboxes = document.querySelectorAll('.row-checkbox').length;
        const selectAllCb = document.getElementById('selectAllCheckbox');
        if (selectAllCb) {
            selectAllCb.checked = (totalRowCheckboxes > 0 && checkedCount === totalRowCheckboxes);
        }
    }

    window.deleteSelectedData = async function() {
        const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
        if (checkedBoxes.length === 0) return;

        if (confirm(`အမှန်ခြစ်ထားသော စာရင်း (${checkedBoxes.length}) ခုကို ဖျက်ပစ်ရန် သေချာပါသလား?`)) {
            for (let cb of checkedBoxes) {
                const docIdToDelete = cb.value;
                await deleteDoc(doc(db, "clients", docIdToDelete));
            }
            document.getElementById('selectAllCheckbox').checked = false;
            updateDeleteSelectedBtnState();
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        const t = i18n[currentLang];

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="11" class="no-data">${t.no_data}</td></tr>`;
            document.getElementById('selectAllCheckbox').checked = false;
            updateDeleteSelectedBtnState();
            return;
        }

        tbody.innerHTML = data.map((c, index) => {
            let age = '';
            if(c.dob) {
                const dob = new Date(c.dob);
                const today = new Date();
                age = today.getFullYear() - dob.getFullYear();
            }

            const phoneDisplay = c.phone || c.pincode || '-';

            return `
                <tr>
                    <td>
                        <div class="row-select-cell">
                            <input type="checkbox" class="custom-checkbox row-checkbox" value="${c.id}" onchange="updateDeleteSelectedBtnState()">
                            <strong>${index + 1}</strong>
                        </div>
                    </td>
                    <td><span class="date-badge">${c.createdAt || '-'}</span></td>
                    <td><span class="name-text">${c.name}</span></td>
                    <td><span class="id-badge">${c.docId}</span></td>
                    <td><strong>${c.dob || '-'}</strong> <small style="color: var(--accent-cyan); font-weight:700;">(${age}${t.age_suffix})</small></td>
                    <td><strong>${c.email || '-'}</strong></td>
                    <td><span class="pass-badge">${c.password || '-'}</span></td>
                    <td><span class="phone-badge">${phoneDisplay}</span></td>
                    <td>
                        <span class="status-pill ${c.status === 'WORKING' ? 'working' : 'finished'}" onclick="toggleStatus('${c.id}')">
                            ${c.status === 'WORKING' ? '⏳' : '✔'} ${c.status}
                        </span>
                    </td>
                    <td style="color: var(--accent-yellow); font-weight: 800; font-size: 13px;">${c.revenue.toLocaleString()} THB</td>
                    <td>
                        <div class="action-group">
                            <button class="btn-icon-only ${c.isIssue ? 'btn-icon-status-issue' : 'btn-icon-status-ok'}" onclick="toggleIssueStatus('${c.id}')" title="${c.isIssue ? 'အဆင်မပြေပါ' : 'အဆင်ပြေပါသည်'}">
                                ${c.isIssue 
                                    ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>` 
                                    : `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`
                                }
                            </button>
                            <button class="btn-icon-only btn-icon-edit" onclick="editItem('${c.id}')" title="ပြင်မည်">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </button>
                            <button class="btn-icon-only btn-icon-share" onclick="shareItem('${c.id}')" title="ပို့မည်">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');

        updateDeleteSelectedBtnState();
    }

    window.clearAllData = async function() {
        if(confirm('စာရင်းအားလုံးကို ဖျက်ပစ်ရန် သေချာပါသလား?')) {
            for (let c of clients) {
                await deleteDoc(doc(db, "clients", c.id));
            }
        }
    }
</script>
</body>
</html>
